<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Spottrack</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <a class="auth-brand" href="index.html"><img src="images/logo.png" alt=""><span>Spottrack</span></a>

    <div class="auth-card">
      <div class="step" id="s-loading">
        <div class="auth-spin"></div>
        <h1 data-i18n="v.loading.t">Verificando tu correo…</h1>
        <p data-i18n="v.loading.p">Un momento, estamos confirmando tu dirección.</p>
      </div>

      <div class="step" id="s-ok" hidden>
        <div class="auth-icon"><i class="fas fa-circle-check"></i></div>
        <h1 data-i18n="v.ok.t">¡Correo verificado!</h1>
        <p data-i18n="v.ok.p">Tu cuenta ya está lista. Volvé a Spottrack e iniciá sesión.</p>
        <a class="auth-btn" href="index.html"><i class="fas fa-house"></i><span data-i18n="back">Volver a Spottrack</span></a>
      </div>

      <div class="step" id="s-err" hidden>
        <div class="auth-icon err"><i class="fas fa-triangle-exclamation"></i></div>
        <h1 data-i18n="v.err.t">Enlace vencido o inválido</h1>
        <p data-i18n="v.err.p">El enlace ya fue usado o venció. Pedí uno nuevo desde la app.</p>
        <a class="auth-btn" href="index.html"><i class="fas fa-house"></i><span data-i18n="back">Volver a Spottrack</span></a>
      </div>
    </div>
  </div>

  <script type="module" src="auth-action.js"></script>
</body>
</html>
